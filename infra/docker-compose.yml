# ALVEARE Core — infra locale (E1). Prod réelle : chartes/serveurs dédiés.
# Secrets : en dev via variables d'env locales ; en prod via Infisical (ADR-0002).

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?infra/.env requis}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?infra/.env requis}
      KC_HEALTH_ENABLED: "true"
      ALV_ADMIN_PASS: ${ALV_ADMIN_PASS}
      ALV_USER_PASS: ${ALV_USER_PASS}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"   # console admin http://localhost:8081 (8080 est occupé sur cette machine par un tunnel SSH vers un autre projet)
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
