# ALVEARE Core — infra locale (E1). Prod réelle : chartes/serveurs dédiés.
# Secrets : en dev via variables d'env locales ; en prod via Infisical (ADR-0002).

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?infra/.env requis}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?infra/.env requis}
      KC_HEALTH_ENABLED: "true"
      ALV_ADMIN_PASS: ${ALV_ADMIN_PASS}
      ALV_USER_PASS: ${ALV_USER_PASS}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"   # console admin http://localhost:8081 (8080 est occupé sur cette machine par un tunnel SSH vers un autre projet)
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # E1 — pooler PostgreSQL (transaction pooling) : les services
  # applicatifs passent par :6432 ; prisma migrate / psql gardent
  # la connexion directe :5432 (les migrations ne doivent pas traverser
  # un pool transactionnel). cf. restes E1.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_DATABASE: alveare_core
      DB_USER: alveare_core_app
      # mot de passe en clair dans userlist.txt — pgbouncer peut alors
      # faire l'authentification SCRAM vers le serveur (PG 18). Fichier
      # généré, jamais commité.
      AUTH_FILE: /etc/pgbouncer/userlist.txt
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "100"
      SERVER_RESET_QUERY: DISCARD ALL
      LOG_LEVEL: info
    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:6432:6432"   # jamais exposé hors loopback en dev

volumes:
  redis-data:
